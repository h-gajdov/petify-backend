# Supply a dedicated empty PostgreSQL test database, never the development database.
spring.datasource.url=${PETIFY_TEST_DB_URL}
spring.datasource.username=${PETIFY_TEST_DB_USERNAME}
spring.datasource.password=${PETIFY_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.jdbc=WARN
logging.level.com.zaxxer.hikari=WARN
